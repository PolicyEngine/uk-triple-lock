name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and committed-output checks
    runs-on: ubuntu-latest
    # Sampled runs on 2026-10-06..07 took about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Depth 1 is sufficient: frozen pilot/rule bindings use committed hashes.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        # The exact versions the committed results were built with
        # (requirements-lock.txt, from `uv pip freeze` of the build
        # environment): test_results compares them. policyengine-uk is pinned
        # there directly (no policyengine.py bundle carries it yet); no test
        # needs the private Enhanced FRS file.
        run: |
          uv pip install -r requirements-lock.txt
          uv pip install --no-deps -e .
      - name: Check the pinned model is installed
        # test_model.py skips when policyengine_uk is missing; fail instead.
        run: python -c "import policyengine_uk"
      - name: Test
        id: pytest
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q -p scripts.pytest_completion --completion-report=.cache/pytest-completion.json --junitxml=.cache/pytest-ci.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Resolve draft status for a manual run
        if: always() && github.event_name == 'workflow_dispatch'
        id: manual_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allow_stale=false
          if [ "$GITHUB_REF_NAME" = "model-v2" ]; then
            allow_stale=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:model-v2" --jq "any(.[]; .state == \"open\" and .draft and .head.ref == \"model-v2\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\" and .head.sha == \"$GITHUB_SHA\")")
          fi
          echo "allow_stale=$allow_stale" >> "$GITHUB_OUTPUT"
      - name: Require only documented pre-build stale-results failures
        if: always()
        env:
          # Main and ready PRs require every committed-output check to pass.
          ALLOW_PREBUILD_STALE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft && github.head_ref == 'model-v2') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'model-v2' && steps.manual_pr.outputs.allow_stale == 'true') }}
        # REBUILD.md names these three failures until the gated full rebuild.
        # Collection errors and every other failure keep this check red.
        run: python scripts/check_prebuild_tests.py .cache/pytest-ci.xml --pytest-exit-code '${{ steps.pytest.outputs.exit_code }}' --completion-report .cache/pytest-completion.json
