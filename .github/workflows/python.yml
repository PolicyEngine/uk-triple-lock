name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and committed-output checks
    runs-on: ubuntu-latest
    # Sampled runs on 2026-10-06..07 took about 10 minutes; PR runs on 2026-10-26..27 took 21 to 28, and one
    # was cancelled at 30 (#41's ready run, 27 October). 60 still stops a hung run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        # Depth 1 is sufficient: frozen pilot/rule bindings use committed hashes.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        # d2011's UK 2.151.0/core 3.33.3 and the carrier the lock pins (policyengine.py 6.11.1,
        # the pair's release; tests require provenance to certify the filled pair). Retained
        # historical pilot receipts keep their original model/data labels;
        # no test needs the private Enhanced FRS file.
        run: |
          uv pip install -r requirements-lock.txt
          uv pip install --no-deps -e .
      - name: Check the pinned model is installed
        # test_model.py skips when policyengine_uk is missing; fail instead.
        run: python -c "import policyengine_uk"
      - name: Test
        id: pytest
        continue-on-error: true
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          set +e
          python -m pytest -q -p scripts.pytest_completion --completion-report=.cache/pytest-completion.json --junitxml=.cache/pytest-ci.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Require only documented pre-build stale-results failures
        if: always()
        # A PR into main (draft or ready) may retain the four exact documented
        # stale-output assertions only while results.json is explicitly a
        # provisional pre-Budget dry run without binding authorization.
        # Main pushes, manual runs, binding results and all other failures are strict.
        run: python scripts/check_prebuild_tests.py .cache/pytest-ci.xml --pytest-exit-code '${{ steps.pytest.outputs.exit_code }}' --completion-report .cache/pytest-completion.json
