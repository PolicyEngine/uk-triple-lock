name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and committed-output checks
    runs-on: ubuntu-latest
    # Sampled runs on 2026-10-06..07 took about 10 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        # The exact versions the committed results were built with
        # (requirements-lock.txt, from `uv pip freeze` of the build
        # environment): test_results compares them. The pinned policyengine
        # release bundle fixes policyengine-uk; no test needs the private
        # Enhanced FRS file.
        run: |
          uv pip install -r requirements-lock.txt
          uv pip install --no-deps -e .
      - name: Check the pinned model is installed
        # test_model.py skips when policyengine_uk is missing; fail instead.
        run: python -c "import policyengine_uk"
      - name: Test
        run: python -m pytest -q
