name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Serve the working paper at /paper with no redirect loop
        run: |
          log="$RUNNER_TEMP/next-start.log"
          ./node_modules/.bin/next start -p 3123 > "$log" 2>&1 &
          server=$!
          stop() {
            kill "$server" 2>/dev/null || true
            for _ in $(seq 1 10); do kill -0 "$server" 2>/dev/null || break; sleep 1; done
            kill -9 "$server" 2>/dev/null || true
            wait "$server" 2>/dev/null || true
          }
          trap stop EXIT
          code=
          for _ in $(seq 1 60); do
            if ! kill -0 "$server" 2>/dev/null; then
              rc=0; wait "$server" || rc=$?
              echo "next start exited with status $rc before serving"; cat "$log"; exit 1
            fi
            code="$(curl -sS -o /dev/null --max-time 2 -w '%{http_code}' http://127.0.0.1:3123/uk/triple-lock \
              2> "$RUNNER_TEMP/ready.err" || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          [ "$code" = 200 ] || { echo "/uk/triple-lock gave '$code' after 60 tries"; cat "$RUNNER_TEMP/ready.err" "$log"; exit 1; }
          bash scripts/check-paper-route.sh http://127.0.0.1:3123 || { cat "$log"; exit 1; }
