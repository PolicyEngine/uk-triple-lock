name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Serve the working paper at /paper with no redirect loop
        run: |
          ./node_modules/.bin/next start -p 3123 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3123/uk/triple-lock && break
            sleep 1
          done
          bash scripts/check-paper-route.sh http://127.0.0.1:3123 || { cat "$RUNNER_TEMP/next-start.log"; exit 1; }
