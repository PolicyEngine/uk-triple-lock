[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-triple-lock"
version = "0.1.0"
description = "The Burnham plan against the State Pension triple lock: cost, who is affected and its expected value, from full PolicyEngine UK runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26",
  "microdf-python>=1.3",
  "openpyxl>=3.1",
  "psutil>=6.1",
  # The time-series models. Pinned: the reproducibility tests compare draws at 1e-12.
  "scipy==1.18.1",
]

[project.optional-dependencies]
# d2011's pair's UK model/core (microcosm#1396's uv.lock), pinned explicitly beside its released carrier.
# The engine constructs policyengine_uk directly and materializes its own pinned data.
# The carrier is installed without [uk]: an extra may pin another model. scripts/fill_release_identities.py sets
# its version from the release, with the identities in datasets.py; then re-resolve the lock (docs/REBUILD.md).
uk = [
  "policyengine==6.11.1",
  "policyengine-uk==2.151.0",
  "policyengine-core==3.33.3",
  "huggingface-hub>=1.0",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8.0",
  "hypothesis==6.168.3",
]

[project.scripts]
triple-lock-build = "triple_lock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triple_lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
