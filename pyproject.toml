[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-triple-lock"
version = "0.1.0"
description = "The Burnham plan against the State Pension triple lock: cost, who is affected and its expected value, from full PolicyEngine UK runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26",
  "microdf-python>=1.3",
  "openpyxl>=3.1",
  "psutil>=6.1",
  # The time-series models. Pinned: the reproducibility tests compare draws at 1e-12.
  "scipy==1.18.1",
]

[project.optional-dependencies]
# policyengine.py is the only modelling dependency: its release bundle
# certifies the policyengine-uk version (2.90.2) and the Enhanced FRS build.
# Do not pin policyengine-uk directly.
uk = [
  "policyengine[uk]==5.3.0",
]
dev = [
  "pytest>=8.0",
  "hypothesis==6.168.3",
]

[project.scripts]
triple-lock-build = "triple_lock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triple_lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
