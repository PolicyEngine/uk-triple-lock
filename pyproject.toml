[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-triple-lock"
version = "0.1.0"
description = "Cost, distribution and forecast uncertainty of the State Pension triple lock and alternative uprating rules, using PolicyEngine UK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# policyengine.py is the only modelling dependency: its release bundle
# certifies the policyengine-uk version (2.90.2) and the Enhanced FRS build.
# Do not pin policyengine-uk directly.
uk = [
  "policyengine[uk]==5.3.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
triple-lock-build = "triple_lock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triple_lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
