[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-triple-lock"
version = "0.1.0"
description = "The Burnham plan against the State Pension triple lock: cost, who is affected and its expected value, from full PolicyEngine UK runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26",
  "microdf-python>=1.3",
  "openpyxl>=3.1",
  "psutil>=6.1",
  # The time-series models. Pinned: the reproducibility tests compare draws at 1e-12.
  "scipy==1.18.1",
]

[project.optional-dependencies]
# policyengine-uk is pinned directly, not through policyengine.py. This
# analysis needs the pensioner fixes released in 2.118.0 (State Pension age by
# date of birth, the additional State Pension by the period's type, the triple
# lock from its statutory inputs, the Housing Benefit, Pension Credit and
# council tax reduction fixes), and no policyengine.py release bundle carries
# them yet: 6.2.1 pins 2.102.3 and will not import beside 2.118.0. The engine
# loads the Enhanced FRS and Microcosm itself, each pinned to a revision and a
# SHA-256 (triple_lock/datasets.py), and every run records that no bundle
# certifies the combination. Go back to a policyengine.py pin once a release
# certifies policyengine-uk >= 2.118.0 with a data build.
uk = [
  "policyengine-uk==2.118.0",
  "huggingface-hub>=1.0",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8.0",
  "hypothesis==6.168.3",
]

[project.scripts]
triple-lock-build = "triple_lock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triple_lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
